<UiSurface
  variant="neutral"
  padding="md"
  className="border-2 border-gray-300 dark:border-gray-700"
>
  <UiFlex direction="column" [gap]="4" [noWrap]="true">
    <UiFlex direction="column" [gap]="1" [noWrap]="true">
      <UiHeader [level]="4" text="Mi bitácora" />
      <UiLabel type="bodyS" color="textWeak" [text]="todayLabel()" />
    </UiFlex>

    @if (!hasEntries()) {
      <UiLabel type="bodyS" color="textWeak" className="italic">
        Sin bloques registrados hoy.
      </UiLabel>
    } @else {
      <UiFlex direction="column" [gap]="0" [noWrap]="true">
      @for (e of entries(); track e.id; let last = $last) {
        <UiFlex
          direction="row"
          alignItems="center"
          [gap]="3"
          [noWrap]="true"
          [className]="
            last
              ? 'w-full py-2.5'
              : 'w-full py-2.5 border-b border-dashed border-gray-200 dark:border-gray-800'
          "
        >
          <UiLabel
            type="bodyXs"
            weight="bold"
            color="textWeak"
            className="font-mono whitespace-nowrap min-w-20"
            [text]="blockTime(e)"
          />
          <UiBadge
            variant="light"
            [color]="e.kind === 'task' ? 'info' : 'light'"
            size="sm"
          >
            {{ kindLabel(e) }}
          </UiBadge>
          <UiLabel
            type="bodyS"
            weight="semibold"
            color="textStrong"
            className="flex-1 min-w-0 truncate"
            [text]="blockTitle(e)"
          />
          <UiLabel
            type="bodyXs"
            weight="medium"
            color="textWeak"
            className="font-mono whitespace-nowrap"
          >
            {{ e.hours }}h
          </UiLabel>
        </UiFlex>
      }
      </UiFlex>
    }

    <UiFlex
      direction="row"
      alignItems="center"
      justifyContent="between"
      [gap]="3"
      className="border-t border-gray-200 pt-3 dark:border-gray-800"
    >
      <UiFlex direction="row" alignItems="center" [gap]="2" [noWrap]="true">
        <IconClock [size]="14" />
        <UiLabel type="bodyXs" weight="bold" color="textStrong">
          Total del día:
        </UiLabel>
        <UiLabel type="bodyXs" weight="bold" color="textStrong" className="font-mono">
          {{ totalHours() }}h
        </UiLabel>
      </UiFlex>
      <UiButton
        variant="primary"
        label="Registrar bloque"
        labelText="Registrar bloque"
        [LeftIcon]="IconPlusSimpleComponent"
        (click)="onRegister()"
      />
    </UiFlex>
  </UiFlex>
</UiSurface>
