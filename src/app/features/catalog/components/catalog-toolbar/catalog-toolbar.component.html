<UiFlex
  direction="row"
  alignItems="center"
  [gap]="12"
  className="flex-wrap"
>
  <UiInput
    className="flex-1 min-w-70"
    type="text"
    placeholder="Buscar por código o nombre…"
    [leftIcon]="searchIcon"
    [value]="searchTerm()"
    (valueChange)="searchChange.emit($event)"
  />
</UiFlex>
