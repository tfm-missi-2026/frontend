<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  [showFooter]="true"
  [size]="'md'"
  title="Restablecer contraseña"
  [subtitle]="'Usuario: ' + fullName() + ' · ' + (user()?.email ?? '')"
  [leftAction]="{
    label: 'Cancelar',
    variant: 'secondary',
    icon: IconX,
  }"
  [rightAction]="{
    label: 'Confirmar restablecimiento',
    variant: 'primary',
    icon: IconCheck,
    disabled: saving(),
    loading: saving(),
  }"
  (close)="onCancel()"
  (action)="onAction($event)"
>
  <UiFlex direction="column" [gap]="4">
    <UiAlert
      variant="warning"
      message="Se generará una contraseña temporal. La contraseña actual del usuario dejará de ser válida."
    />

    <UiFlex direction="column" [gap]="2">
      <UiFlex direction="row" alignItems="center" justifyContent="between">
        <UiFormLabel
          labelText="Contraseña temporal generada"
          [labelFor]="'reset-password-display'"
        />
        <UiButton
          variant="secondary"
          [compact]="true"
          [LeftIcon]="copyIcon"
          labelText="Copiar"
          (click)="onCopy()"
        />
      </UiFlex>

      <UiFlex
        direction="row"
        alignItems="center"
        justifyContent="between"
        [gap]="3"
        className="rounded-xl border border-dashed border-gray-300 bg-gray-50 px-4 py-3 dark:border-gray-700 dark:bg-white/3"
      >
        <UiLabel
          type="HeadingM"
          weight="bold"
          color="textStrong"
          className="font-mono tracking-widest"
          [text]="generatedPassword()"
        />
      </UiFlex>

      @if (copyFeedback() === "success") {
        <UiAlert
          variant="success"
          message="Contraseña temporal copiada al portapapeles."
        />
      } @else if (copyFeedback() === "error") {
        <UiAlert
          variant="error"
          message="No se pudo copiar la contraseña. Selecciónala manualmente."
        />
      }

      <UiLabel type="bodyS" color="textWeak">
        Entregue esta contraseña temporal al usuario. Deberá cambiarla en su
        primer acceso.
      </UiLabel>
    </UiFlex>

    <UiAlert
      variant="info"
      message="Este flujo permite que el administrador restablezca la contraseña cuando un usuario no puede acceder."
    />
  </UiFlex>
</UiModal>
