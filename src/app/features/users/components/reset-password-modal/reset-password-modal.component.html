<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  className="max-w-115 p-6 lg:p-8"
  (close)="onCancel()"
>
  <UiLabel
    type="HeadingM"
    color="textStrong"
    weight="semibold"
    className="mb-1"
  >
    Restablecer contraseña
  </UiLabel>
  <UiLabel type="bodyS" color="textWeak" className="mb-4">
    Usuario:
    <b class="text-gray-800 dark:text-white/90">{{ fullName() }}</b> ·
    {{ user()?.email }}
  </UiLabel>

  <UiAlert
    variant="warning"
    message="Se generará una contraseña temporal. La contraseña actual del usuario dejará de ser válida."
    className="mb-4"
  />

  <UiLabel
    type="bodyXs"
    color="textStrong"
    weight="medium"
    className="mb-2 block uppercase"
  >
    Contraseña temporal generada
  </UiLabel>
  <UiFlex
    direction="row"
    alignItems="center"
    [justifyContent]="'between'"
    [gap]="12"
    className="mb-2 rounded-xl border border-dashed border-gray-300 bg-gray-50 px-4 py-3 dark:border-gray-700 dark:bg-white/3"
  >
    <code
      class="font-mono text-xl font-bold tracking-widest text-gray-800 dark:text-white/90"
    >
      {{ generatedPassword() }}
    </code>
    <UiButton
      variant="secondary"
      [compact]="true"
      [LeftIcon]="copyIcon"
      label="Copiar"
      (click)="onCopy()"
    />
  </UiFlex>
  <UiLabel type="bodyS" color="textWeak" className="mb-4">
    <b class="text-gray-800 dark:text-white/90"
      >Entregue esta contraseña temporal al usuario.</b
    >
    Deberá cambiarla en su primer acceso.
  </UiLabel>

  @if (copyFeedback() === "success") {
    <UiAlert
      variant="success"
      message="Contraseña temporal copiada al portapapeles."
      className="mb-4"
    />
  } @else if (copyFeedback() === "error") {
    <UiAlert
      variant="error"
      message="No se pudo copiar la contraseña. Selecciónala manualmente."
      className="mb-4"
    />
  }

  <UiAlert
    variant="info"
    message="Este flujo permite que el administrador restablezca la contraseña cuando un usuario no puede acceder."
    className="mb-4"
  />

  <UiFlex
    direction="row"
    [justifyContent]="'end'"
    [gap]="8"
    className="mt-4 border-t border-dashed border-gray-200 pt-4 dark:border-gray-800"
  >
    <UiButton variant="secondary" label="Cerrar" (click)="onCancel()" />
    <UiButton
      variant="primary"
      label="Confirmar restablecimiento"
      (click)="onConfirm()"
    />
  </UiFlex>
</UiModal>
