<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  [showFooter]="true"
  [size]="'lg'"
  [title]="heading()"
  [subtitle]="subheading()"
  [leftAction]="{
    label: 'Cancelar',
    variant: 'secondary',
    icon: IconX,
  }"
  [rightAction]="{
    label: mode() === 'create' ? 'Crear usuario' : 'Guardar cambios',
    variant: 'primary',
    icon: IconCheck,
    disabled: !isValid() || saving(),
    loading: saving(),
  }"
  (close)="onCancel()"
  (action)="onAction($event)"
>
  <UiFlex direction="column" [gap]="4">
    <UiFlex direction="column" [gap]="1">
      <UiFormLabel
        labelText="Nombres"
        [required]="true"
        [labelFor]="'user-firstName'"
      />
      <UiInput
        id="user-firstName"
        placeholder="p. ej. Ana María"
        [value]="form().firstName"
        (valueChange)="patch({ firstName: $event })"
        (blurEvt)="onFirstNameBlur()"
        [errorMessage]="visibleFirstNameError()"
        [maxLength]="80"
      />
      <UiFieldError [message]="visibleFirstNameError()" />
    </UiFlex>

    <UiGrid [columns]="2" gap="gap-4">
      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Apellido paterno"
          [required]="true"
          [labelFor]="'user-lastNamePaternal'"
        />
        <UiInput
          id="user-lastNamePaternal"
          placeholder="p. ej. Quispe"
          [value]="form().lastNamePaternal"
          (valueChange)="patch({ lastNamePaternal: $event })"
          (blurEvt)="onLastNamePaternalBlur()"
          [errorMessage]="visibleLastNamePaternalError()"
          [maxLength]="80"
        />
        <UiFieldError [message]="visibleLastNamePaternalError()" />
      </UiFlex>

      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Apellido materno"
          [required]="true"
          [labelFor]="'user-lastNameMaternal'"
        />
        <UiInput
          id="user-lastNameMaternal"
          placeholder="p. ej. Rojas"
          [value]="form().lastNameMaternal"
          (valueChange)="patch({ lastNameMaternal: $event })"
          (blurEvt)="onLastNameMaternalBlur()"
          [errorMessage]="visibleLastNameMaternalError()"
          [maxLength]="80"
        />
        <UiFieldError [message]="visibleLastNameMaternalError()" />
      </UiFlex>
    </UiGrid>

    <UiFlex direction="column" [gap]="1">
      <UiFormLabel
        labelText="Correo electrónico"
        [required]="true"
        [labelFor]="'user-email'"
      />
      <UiInput
        id="user-email"
        type="email"
        placeholder="nombre.apellido@institucion.gob.pe"
        [value]="form().email"
        (valueChange)="patch({ email: $event })"
        (blurEvt)="onEmailBlur()"
        [errorMessage]="visibleEmailError()"
      />
      <UiFieldError [message]="visibleEmailError()" />
    </UiFlex>

    <UiGrid [columns]="2" gap="gap-4">
      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Rol"
          [required]="true"
          [labelFor]="'user-role'"
        />
        <UiSelect
          inputId="user-role"
          [options]="roleOptions"
          [searchable]="false"
          [isClearable]="true"
          placeholder="Selecciona un rol…"
          [ngModel]="form().role"
          (ngModelChange)="onRoleChange($event)"
          [errorMessage]="visibleRoleError()"
        />
        @if (!visibleRoleError()) {
          <UiLabel
            type="bodyXs"
            color="textWeak"
            text="Define a qué módulos del sidebar tendrá acceso."
          />
        }
      </UiFlex>

      <UiFlex direction="column" [gap]="1">
        <UiFormLabel labelText="Estado" [labelFor]="'user-status'" />
        <UiFlex direction="row" alignItems="center" [gap]="3" className="h-11">
          <UiCheckbox
            id="user-status"
            label="Usuario activo"
            [checked]="form().status === 'active'"
            (checkedChange)="onActiveToggle($event)"
          />
        </UiFlex>
        <UiLabel
          type="bodyXs"
          color="textWeak"
          text="Desmarca para inhabititar al usuario sin eliminarlo."
        />
      </UiFlex>
    </UiGrid>

    @if (mode() === "create") {
      <UiSurface variant="neutral" padding="md">
        <UiFlex direction="column" [gap]="3">
          <UiFlex direction="row" alignItems="center" justifyContent="between">
            <UiFormLabel
              labelText="Contraseña inicial"
              [required]="true"
              [labelFor]="'user-initialPassword'"
            />
            <UiBadge variant="light" color="info" size="sm">
              Solo en alta
            </UiBadge>
          </UiFlex>
          <UiInput
            id="user-initialPassword"
            type="password"
            placeholder="Mínimo 8 caracteres"
            [showPasswordToggle]="true"
            [value]="form().initialPassword ?? ''"
            (valueChange)="patch({ initialPassword: $event })"
            (blurEvt)="onInitialPasswordBlur()"
            [errorMessage]="visibleInitialPasswordError()"
          />
          <UiFieldError [message]="visibleInitialPasswordError()" />
          <UiLabel
            type="bodyXs"
            color="textWeak"
            text="Al editar un usuario existente este campo no aparece; la contraseña se cambia desde “Restablecer”."
          />
        </UiFlex>
      </UiSurface>
    }
  </UiFlex>
</UiModal>
