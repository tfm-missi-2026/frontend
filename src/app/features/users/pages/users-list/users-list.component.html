<UiFlex direction="column" [gap]="5">
  <CommonBreadcrumb [items]="breadcrumbItems" />

  <UiFlex
    direction="row"
    alignItems="center"
    justifyContent="between"
    [gap]="3"
    className="flex-wrap"
  >
    <UiHeader [level]="1" text="Gestión de usuarios" />
    <UiButton
      variant="primary"
      [LeftIcon]="plusIcon"
      labelText="Nuevo usuario"
      (click)="openCreate()"
    />
  </UiFlex>

  @if (successAlert(); as msg) {
    <UiAlert
      variant="success"
      [message]="msg"
      className="cursor-pointer"
      (click)="onDismissAlert()"
    />
  }

  @if (errorMessage(); as msg) {
    <UiAlert variant="error" [message]="msg" />
  }

  <UiFlex direction="row" [gap]="3" className="flex-wrap">
    <UiSelect
      inputId="filtro-rol"
      [options]="rolOptions"
      [searchable]="false"
      [isClearable]="true"
      placeholder="Rol: Todos"
      [width]="'180px'"
      [ngModel]="filterRol()"
      (ngModelChange)="onRolChange($event)"
    />
    <UiSelect
      inputId="filtro-estado"
      [options]="statusOptions"
      [searchable]="false"
      [isClearable]="true"
      placeholder="Estado: Todos"
      [width]="'170px'"
      [ngModel]="filterStatus()"
      (ngModelChange)="onStatusChange($event)"
    />
  </UiFlex>

  <UiTable
    [query]="admin.query()"
    [fetchData]="fetchUsers"
    [columns]="tableColumns()"
    [searchable]="true"
    [paginated]="true"
    [pageSizeOptions]="pageSizeOptions"
    searchPlaceholder="Buscar por nombre o correo…"
    emptyText="No hay usuarios que coincidan con los filtros."
    (queryChange)="onQueryChange($event)"
  ></UiTable>
</UiFlex>

<!-- Templates de celda para UiTable (referenciados por tableColumns) -->
<ng-template #nombreCell let-u>
  <UiLabel
    type="bodyS"
    weight="semibold"
    color="textStrong"
    [text]="fullName(u)"
  />
</ng-template>

<ng-template #rolCell let-u>
  <UiBadge variant="light" color="primary" size="sm">
    {{ roleLabel(u.role) }}
  </UiBadge>
</ng-template>

<ng-template #estadoCell let-u>
  @if (u.status === "active") {
    <UiBadge variant="light" color="success" size="sm">Activo</UiBadge>
  } @else {
    <UiBadge variant="light" color="error" size="sm">Inactivo</UiBadge>
  }
</ng-template>

<ng-template #accionesCell let-u>
  <UiFlex [gap]="2" [alignItems]="'center'" [justifyContent]="'end'" [noWrap]="true">
    <UiButton
      variant="secondary"
      size="sm"
      [LeftIcon]="editIcon"
      labelText="Editar"
      (click)="openEdit(u)"
    />
    <UiButton
      variant="secondary"
      size="sm"
      [LeftIcon]="envelopeIcon"
      labelText="Restablecer"
      (click)="openResetPassword(u)"
    />
    <UiButton
      variant="primary"
      size="sm"
      [LeftIcon]="trashIcon"
      labelText="Dar de baja"
      (click)="onDeactivate(u)"
    />
  </UiFlex>
</ng-template>

<!--
  Modal de crear/editar usuario. Un solo modal con `mode` interno;
  la pagina decide el modo segun `modalState()`. `saving` controlado
  por la pagina para evitar doble submit y mostrar spinner.
-->
<UserFormModal
  [isOpen]="modalState() !== null"
  [mode]="formModalMode()"
  [user]="editingUser()"
  [saving]="formSaving()"
  (close)="closeFormModal()"
  (save)="onSaveUser($event)"
/>

<!--
  Modal de restablecimiento de contrasena. El componente solo emite
  el payload; la pagina llama a `admin.resetPassword()` y muestra
  feedback de exito/error. Mantener el servicio fuera del modal
  evita acoplar el componente al backend y permite testear el modal
  sin levantar DI.
-->
<ResetPasswordModal
  [isOpen]="resetTarget() !== null"
  [user]="resetTarget()"
  [saving]="resetSaving()"
  (close)="closeResetModal()"
  (confirm)="onConfirmReset($event)"
/>
