<UiFlex direction="column" [gap]="5">
  <CommonBreadcrumb [items]="breadcrumbItems" />

  <UiFlex
    direction="row"
    alignItems="center"
    justifyContent="between"
    [gap]="3"
    className="flex-wrap"
  >
    <UiHeader [level]="1" text="Roles y permisos" />
    <UiButton
      variant="primary"
      [LeftIcon]="plusIcon"
      label="Nuevo rol"
      (click)="onCreate()"
    />
  </UiFlex>

  @if (successAlert(); as msg) {
    <UiAlert
      variant="success"
      [message]="msg"
      className="cursor-pointer"
      (click)="onDismissAlert()"
    />
  }

  @if (error(); as errMsg) {
    <UiAlert variant="error" [message]="errMsg" />
  }

  <UiFlex
    alignItems="start"
    className="grid gap-5 lg:grid-cols-[280px_1fr]"
  >
    <UiFlex direction="column" [gap]="3" className="min-w-0">
      @if (loading()) {
        <UiCard variant="default" padding="lg">
          <UiLabel
            type="bodyS"
            color="textWeak"
            text="Cargando roles..."
          />
        </UiCard>
      } @else {
        <RoleListPanel
          [roles]="roles()"
          [selectedId]="selectedId()"
          [totalModules]="totalModules()"
          (select)="onSelectRole($event)"
        />
      }
    </UiFlex>

    <UiFlex direction="column" [gap]="3" className="min-w-0">
      @if (selectedRole(); as role) {
        <UiCard variant="default" padding="lg" className="h-full">
          <UiFlex
            direction="row"
            alignItems="start"
            justifyContent="between"
            [gap]="3"
            className="flex-wrap"
          >
            <UiFlex
              direction="column"
              [gap]="1"
              [flex]="'1'"
              [shrinkable]="true"
              className="min-w-0"
            >
              <UiHeader
                [level]="2"
                [text]="role.name"
                className="text-2xl"
              />
              <UiLabel
                type="bodyS"
                color="textWeak"
                [text]="role.description || 'Sin descripción.'"
                className="mt-1 block max-w-prose"
              />
            </UiFlex>
            <UiFlex direction="row" [gap]="2" alignItems="center">
              <UiBadge
                [variant]="role.sistema ? 'light' : 'light'"
                [color]="role.sistema ? 'primary' : 'info'"
                size="md"
              >
                {{ role.code }}
              </UiBadge>
              @if (canEditCamposSelected()) {
                <UiButton
                  variant="secondary"
                  [LeftIcon]="pencilIcon"
                  label="Editar"
                  (click)="onEditRole()"
                />
                <UiButton
                  variant="secondary"
                  [LeftIcon]="trashIcon"
                  label="Eliminar"
                  (click)="onRequestDelete()"
                />
              } @else if (canEditPermisosSelected()) {
                <UiButton
                  variant="secondary"
                  [LeftIcon]="pencilIcon"
                  label="Editar permisos"
                  (click)="onEditRole()"
                />
              }
            </UiFlex>
          </UiFlex>

          <UiSeparator className="mt-5" />

          <UiFlex direction="column" [gap]="3">
            <UiFlex direction="row" alignItems="center" justifyContent="between">
              <UiLabel
                type="bodyXs"
                color="textWeak"
                weight="medium"
                className="uppercase tracking-wider"
                text="Permisos de módulos"
              />
              <UiLabel
                type="bodyXs"
                color="textWeak"
                [text]="permissionCountLabel()"
              />
            </UiFlex>
            <PermissionsMatrix
              [modules]="modulosRaiz()"
              [selected]="selectedPermissions()"
              [readonly]="true"
              [landingCodigo]="selectedRole()?.paginaInicioCodigo ?? null"
            />
            @if (role.sistema) {
              <UiLabel
                type="bodyXs"
                color="textWeak"
                text="Los roles del sistema son de solo lectura en sus datos (nombre, descripción, página de inicio), pero puedes ajustar los módulos del sidebar desde 'Editar permisos'."
              />
            }
          </UiFlex>
        </UiCard>
      } @else {
        <UiCard variant="default" padding="lg">
          <UiLabel
            type="bodyS"
            color="textWeak"
            text="Selecciona un rol de la lista para ver sus permisos."
          />
        </UiCard>
      }
    </UiFlex>
  </UiFlex>
</UiFlex>

<RoleFormModal
  [isOpen]="createOpen()"
  (close)="createOpen.set(false)"
  (save)="onSaveRole($event)"
/>

<RoleEditModal
  [role]="selectedRole()"
  [modules]="modulosRaiz()"
  [permisosIniciales]="selectedPermissions()"
  [camposReadonly]="!canEditCamposSelected()"
  [isOpen]="editTargetId() !== null"
  (close)="editTargetId.set(null)"
  (save)="onSaveEdit($event)"
/>

<RoleConfirmDeleteModal
  [role]="selectedRole()"
  [isOpen]="deleteTargetId() !== null"
  (close)="deleteTargetId.set(null)"
  (confirm)="onConfirmDelete($event)"
/>
