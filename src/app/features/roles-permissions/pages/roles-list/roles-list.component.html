<UiFlex direction="column" [gap]="5">
  <CommonBreadcrumb [items]="breadcrumbItems" />

  <UiFlex
    direction="row"
    alignItems="center"
    justifyContent="between"
    [gap]="3"
    className="flex-wrap"
  >
    <UiHeader [level]="1" text="Roles y permisos" />
    <UiButton
      variant="primary"
      [LeftIcon]="plusIcon"
      labelText="Nuevo rol"
      (click)="onCreate()"
    />
  </UiFlex>

  @if (successAlert(); as msg) {
    <UiAlert
      variant="success"
      [message]="msg"
      className="cursor-pointer"
      (click)="onDismissAlert()"
    />
  }

  @if (error(); as errMsg) {
    <UiAlert variant="error" [message]="errMsg" />
  }

  <div class="grid grid-cols-1 gap-5 lg:grid-cols-[280px_1fr]">
    <div>
      @if (loading()) {
        <UiCard variant="default" padding="lg">
          <UiLabel
            type="bodyS"
            color="textWeak"
            text="Cargando roles..."
          />
        </UiCard>
      } @else {
        <RoleListPanel
          [roles]="roles()"
          [selectedId]="selectedId()"
          [totalModules]="totalModules()"
          (select)="onSelectRole($event)"
        />
      }
    </div>

    <div>
      @if (selectedRole(); as role) {
        <UiCard variant="default" padding="lg" className="h-full">
          <UiFlex
            direction="row"
            alignItems="start"
            justifyContent="between"
            [gap]="3"
            className="flex-wrap"
          >
            <div class="min-w-0 flex-1">
              <UiHeader
                [level]="2"
                [text]="role.name"
                className="text-2xl"
              />
              <UiLabel
                type="bodyS"
                color="textWeak"
                [text]="role.description"
                className="mt-2 block max-w-prose"
              />
            </div>
            <UiFlex direction="row" [gap]="2" alignItems="center">
              <UiBadge
                [variant]="role.sistema ? 'light' : 'light'"
                [color]="role.sistema ? 'primary' : 'info'"
                size="md"
              >
                {{ role.code }}
              </UiBadge>
              @if (!role.sistema) {
                <UiButton
                  variant="secondary"
                  size="sm"
                  [LeftIcon]="pencilIcon"
                  labelText="Editar"
                  (click)="onEditRole()"
                />
                <UiButton
                  variant="secondary"
                  size="sm"
                  [LeftIcon]="trashIcon"
                  labelText="Eliminar"
                  (click)="onRequestDelete()"
                />
              }
            </UiFlex>
          </UiFlex>

          <div
            class="mt-6 flex flex-col gap-2 border-t border-dashed border-gray-200 pt-4 dark:border-gray-800 sm:flex-row sm:items-center sm:justify-between"
          >
            <UiLabel
              type="bodyXs"
              color="textWeak"
              weight="medium"
              className="uppercase tracking-wider"
              text="Modulos visibles / permisos"
            />
            <UiLabel
              type="bodyXs"
              color="textWeak"
              [text]="permissionCountLabel()"
            />
          </div>
          <UiLabel
            type="bodyS"
            color="textWeak"
            className="mt-2 block"
            text="Marca los modulos del sidebar a los que este rol puede acceder."
          />

          <div class="mt-4">
            <PermissionsMatrix
              [modules]="modulosRaiz()"
              [selected]="effectivePermissions()"
              [readonly]="!canEditSelected()"
              [landingCodigo]="selectedRole()?.paginaInicioCodigo ?? null"
              (selectedChange)="onPermissionsChange($event)"
            />
          </div>

          @if (canEditSelected()) {
            <UiFlex
              direction="row"
              justifyContent="end"
              [gap]="2"
              className="mt-6 border-t border-dashed border-gray-200 pt-4 dark:border-gray-800"
            >
              <UiButton
                variant="secondary"
                labelText="Cancelar"
                [disabled]="!hasChanges()"
                (click)="onCancelPermissions()"
              />
              <UiButton
                variant="primary"
                [LeftIcon]="checkIcon"
                labelText="Guardar cambios"
                [disabled]="!hasChanges()"
                (click)="onSavePermissions()"
              />
            </UiFlex>
          } @else {
            <UiLabel
              type="bodyXs"
              color="textWeak"
              className="mt-6 block border-t border-dashed border-gray-200 pt-4 dark:border-gray-800"
              text="Los roles del sistema son de solo lectura."
            />
          }
        </UiCard>
      } @else {
        <UiCard variant="default" padding="lg">
          <UiLabel
            type="bodyS"
            color="textWeak"
            text="Selecciona un rol de la lista para ver sus permisos."
          />
        </UiCard>
      }
    </div>
  </div>
</UiFlex>

<RoleFormModal
  [isOpen]="createOpen()"
  (close)="createOpen.set(false)"
  (save)="onSaveRole($event)"
/>

<RoleEditModal
  [role]="selectedRole()"
  [isOpen]="editTargetId() !== null"
  (close)="editTargetId.set(null)"
  (save)="onSaveEdit($event)"
/>

<RoleConfirmDeleteModal
  [role]="selectedRole()"
  [isOpen]="deleteTargetId() !== null"
  (close)="deleteTargetId.set(null)"
  (confirm)="onConfirmDelete($event)"
/>
