<div class="flex flex-col gap-5" aria-label="Módulos visibles / permisos">
  @for (group of groups(); track group.key) {
    <div class="flex flex-col gap-2">
      <UiLabel
        type="bodyXs"
        color="textWeak"
        weight="medium"
        className="uppercase tracking-wider"
        [text]="group.title"
      />
      <UiGrid [columns]="2" [breakpoint]="'sm'" [gap]="'gap-2'">
        @for (m of group.modules; track m.id) {
          @if (readonly()) {
            <div
              class="flex items-center gap-3 rounded-lg border px-4 py-2.5"
              [class]="cellClasses(m.codigo)"
            >
              @if (isEnabled(m.codigo)) {
                <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-md bg-brand-500 text-white">
                  <svg viewBox="0 0 20 20" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                    <path d="M5 10.5l3.5 3.5L15 7" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </span>
              } @else {
                <span class="h-5 w-5 shrink-0 rounded-md border border-gray-300 dark:border-gray-700"></span>
              }
              <UiLabel
                type="bodyS"
                [color]="isEnabled(m.codigo) ? 'textStrong' : 'textWeak'"
                weight="medium"
                [text]="m.nombre"
                className="flex-1"
              />
              @if (isLanding(m.codigo)) {
                <UiBadge variant="light" color="primary" size="sm">Inicio</UiBadge>
              }
            </div>
          } @else {
            <label
              class="flex cursor-pointer items-center gap-3 rounded-lg border px-4 py-2.5 text-sm transition-colors"
              [class]="cellClasses(m.codigo)"
            >
              <UiCheckbox
                [checked]="isEnabled(m.codigo)"
                (checkedChange)="onToggle(m.codigo, $event)"
              />
              <UiLabel
                type="bodyS"
                color="textStrong"
                weight="medium"
                [text]="m.nombre"
                className="flex-1"
              />
              @if (isLanding(m.codigo)) {
                <UiBadge variant="light" color="primary" size="sm">Inicio</UiBadge>
              }
            </label>
          }
        }
      </UiGrid>
    </div>
  }
</div>
