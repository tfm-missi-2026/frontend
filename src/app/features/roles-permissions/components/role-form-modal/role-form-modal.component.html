<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="false"
  className="max-w-120 p-6 lg:p-8"
  (close)="onCancel()"
>
  <UiHeader [level]="2" text="Nuevo rol" className="mb-1" />
  <UiLabel
    type="bodyS"
    color="textWeak"
    className="mb-5 block"
    text="Define un rol. Sus permisos de módulo se configuran después de crearlo."
  />

  <div class="mb-4">
    <UiFormLabel
      labelText="Código"
      [required]="true"
      [labelFor]="'role-code'"
    />
    <UiInput
      id="role-code"
      placeholder="p. ej. GP — corto, único"
      [value]="form().code"
      (valueChange)="patch({ code: $event })"
      [errorMessage]="errors().code"
    />
    @if (!errors().code) {
      <UiLabel
        type="bodyXs"
        color="textWeak"
        className="mt-1 block"
        text="Identificador corto del rol (2–4 letras)."
      />
    }
    <UiFieldError [message]="errors().code" />
  </div>

  <div class="mb-4">
    <UiFormLabel
      labelText="Nombre"
      [required]="true"
      [labelFor]="'role-name'"
    />
    <UiInput
      id="role-name"
      placeholder="p. ej. Gestor de Proyecto"
      [value]="form().name"
      (valueChange)="patch({ name: $event })"
      [errorMessage]="errors().name"
    />
    <UiFieldError [message]="errors().name" />
  </div>

  <div class="mb-4">
    <UiFormLabel
      labelText="Página de inicio (tras el login)"
      [required]="true"
      [labelFor]="'role-pagina-inicio'"
    />
    <UiSelect
      inputId="role-pagina-inicio"
      [options]="moduloOpciones()"
      [searchable]="true"
      placeholder="Selecciona el módulo que ve el rol tras el login"
      [ngModel]="form().paginaInicioId"
      (ngModelChange)="onPaginaInicioChange($event)"
    />
    @if (!errors().paginaInicioId) {
      <UiLabel
        type="bodyXs"
        color="textWeak"
        className="mt-1 block"
        text="El rol siempre debe tener una página de inicio configurada."
      />
    }
    <UiFieldError [message]="errors().paginaInicioId" />
  </div>

  <div class="mb-4">
    <UiFormLabel labelText="Descripción" [labelFor]="'role-desc'" />
    <UiTextArea
      id="role-desc"
      [rows]="3"
      placeholder="¿Qué hace este rol dentro de SPSRT?"
      [value]="form().description"
      (valueChange)="patch({ description: $event })"
    />
  </div>

  <UiFlex
    direction="row"
    justifyContent="end"
    [gap]="2"
    className="mt-4 border-t border-dashed border-gray-200 pt-4 dark:border-gray-800"
  >
    <UiButton
      variant="secondary"
      labelText="Cancelar"
      (click)="onCancel()"
    />
    <UiButton
      variant="primary"
      labelText="Crear rol"
      [disabled]="!isValid()"
      (click)="onSave()"
    />
  </UiFlex>
</UiModal>
