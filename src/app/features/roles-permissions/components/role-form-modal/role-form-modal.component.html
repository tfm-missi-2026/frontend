<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  [showFooter]="true"
  [size]="'3xl'"
  title="Nuevo rol"
  subtitle="Define el rol y marca los módulos del sidebar a los que podrá acceder."
  [leftAction]="{
    label: 'Cancelar',
    variant: 'secondary',
    icon: IconX,
  }"
  [rightAction]="{
    label: 'Crear rol',
    variant: 'primary',
    icon: IconCheck,
    disabled: !isValid() || saving(),
    loading: saving(),
  }"
  (close)="onCancel()"
  (action)="onAction($event)"
>
  <UiFlex direction="row" [gap]="5" className="min-w-0">
    <UiFlex
      direction="column"
      [gap]="3"
      [flex]="'1'"
      [shrinkable]="true"
      className="min-w-0"
    >
      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Código"
          [required]="true"
          [labelFor]="'role-code'"
        />
        <UiInput
          id="role-code"
          placeholder="p. ej. GP — corto, único"
          [value]="form().code"
          (valueChange)="patch({ code: $event })"
          (blurEvt)="onCodeBlur()"
          [errorMessage]="visibleErrors().code"
          [maxLength]="4"
        />
        @if (!visibleErrors().code) {
          <UiLabel
            type="bodyXs"
            color="textWeak"
            text="Identificador corto del rol (2–4 caracteres alfanuméricos)."
          />
        }
        <UiFieldError [message]="visibleErrors().code" />
      </UiFlex>

      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Nombre"
          [required]="true"
          [labelFor]="'role-name'"
        />
        <UiInput
          id="role-name"
          placeholder="p. ej. Gestor de Proyecto"
          [value]="form().name"
          (valueChange)="patch({ name: $event })"
          (blurEvt)="onNameBlur()"
          [errorMessage]="visibleErrors().name"
          [maxLength]="100"
        />
        <UiFieldError [message]="visibleErrors().name" />
      </UiFlex>

      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Página de inicio (tras el login)"
          [required]="true"
          [labelFor]="'role-pagina-inicio'"
        />
        <UiSelect
          inputId="role-pagina-inicio"
          [options]="moduloOpciones()"
          [searchable]="true"
          placeholder="Selecciona el módulo que ve el rol tras el login"
          [ngModel]="form().paginaInicioId"
          (ngModelChange)="onPaginaInicioChange($event)"
          (blur)="onPaginaInicioBlur()"
        />
        @if (!visibleErrors().paginaInicioId) {
          <UiLabel
            type="bodyXs"
            color="textWeak"
            text="El rol siempre debe tener una página de inicio configurada. Se añadirá automáticamente a sus permisos."
          />
        }
        <UiFieldError [message]="visibleErrors().paginaInicioId" />
      </UiFlex>

      <UiFlex direction="column" [gap]="1">
        <UiFormLabel labelText="Descripción" [labelFor]="'role-desc'" />
        <UiTextArea
          id="role-desc"
          [rows]="2"
          placeholder="¿Qué hace este rol dentro de SPSRT?"
          [value]="form().description"
          (valueChange)="patch({ description: $event })"
          (blurEvt)="onDescriptionBlur()"
        />
        <UiFieldError [message]="visibleErrors().description" />
      </UiFlex>
    </UiFlex>

    <UiFlex
      direction="column"
      [gap]="2"
      [flex]="'1'"
      [shrinkable]="true"
      className="min-w-0"
    >
      <UiFlex
        direction="row"
        alignItems="center"
        justifyContent="between"
        className="min-w-0"
      >
        <UiLabel
          type="bodyS"
          weight="semibold"
          color="textStrong"
          text="Permisos de módulos"
        />
        <UiLabel
          type="bodyXs"
          color="textWeak"
          [text]="permisos().length + ' de ' + modules().length + ' módulos'"
        />
      </UiFlex>
      <UiLabel
        type="bodyXs"
        color="textWeak"
        text="Marca los módulos del sidebar a los que este rol podrá acceder. La página de inicio siempre queda otorgada."
      />
      <PermissionsMatrix
        [modules]="modules()"
        [selected]="permisos()"
        [readonly]="false"
        [landingCodigo]="landingCodigo()"
        (selectedChange)="onPermisosChange($event)"
      />
    </UiFlex>
  </UiFlex>
</UiModal>
