<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="false"
  className="max-w-120 p-6 lg:p-8"
  (close)="onCancel()"
>
  @if (role(); as r) {
    <UiHeader [level]="2" text="Editar rol" />
    <UiLabel
      type="bodyS"
      color="textWeak"
      className="mt-1 block"
      [text]="'Código ' + r.code + ' (no modificable)'"
    />

    <div className="mt-5 mb-4">
      <UiFormLabel
        labelText="Nombre"
        [required]="true"
        [labelFor]="'role-edit-name'"
      />
      <UiInput
        id="role-edit-name"
        placeholder="p. ej. Gestor de Proyecto"
        [value]="nombre()"
        (valueChange)="patchNombre($event)"
        [errorMessage]="errorMessage()"
      />
      <UiFieldError [message]="errorMessage()" />
    </div>

    <div className="mb-4">
      <UiFormLabel
        labelText="Descripción"
        [labelFor]="'role-edit-desc'"
      />
      <UiTextArea
        id="role-edit-desc"
        [rows]="3"
        placeholder="¿Qué hace este rol dentro de SPSRT?"
        [value]="descripcion()"
        (valueChange)="patchDescripcion($event)"
      />
    </div>

    <div className="mb-4">
      <UiFormLabel
        labelText="Página de inicio (tras el login)"
        [required]="true"
        [labelFor]="'role-edit-pagina-inicio'"
      />
      <UiSelect
        inputId="role-edit-pagina-inicio"
        [options]="moduloOpciones()"
        [searchable]="true"
        placeholder="Selecciona el módulo que ve el rol tras el login"
        [ngModel]="paginaInicioId()"
        (ngModelChange)="onPaginaInicioChange($event)"
      />
      @if (!paginaInicioError()) {
        <UiLabel
          type="bodyXs"
          color="textWeak"
          className="mt-1 block"
          text="El rol siempre debe tener una página de inicio configurada."
        />
      }
      <UiFieldError [message]="paginaInicioError()" />
    </div>

    <UiFlex
      direction="row"
      justifyContent="end"
      [gap]="2"
      className="mt-4 border-t border-dashed border-gray-200 dark:border-gray-800 pt-4"
    >
      <UiButton
        variant="secondary"
        labelText="Cancelar"
        (click)="onCancel()"
      />
      <UiButton
        variant="primary"
        labelText="Guardar cambios"
        [disabled]="!isValid()"
        (click)="onSave()"
      />
    </UiFlex>
  }
</UiModal>
