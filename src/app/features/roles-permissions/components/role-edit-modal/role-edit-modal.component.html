<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  [showFooter]="true"
  [size]="'3xl'"
  title="Editar rol"
  [subtitle]="subtitleText()"
  [leftAction]="{
    label: 'Cancelar',
    variant: 'secondary',
    icon: IconX,
    tooltip: 'Descartar cambios y cerrar',
  }"
  [rightAction]="{
    label: 'Guardar Cambios',
    variant: 'primary',
    icon: IconCheck,
    disabled: !isValid() || !hasChanges() || saving(),
    loading: saving(),
  }"
  (close)="onCancel()"
  (action)="onAction($event)"
>
  <UiFlex direction="row" [gap]="5" className="min-w-0">
    <UiFlex
      direction="column"
      [gap]="3"
      [flex]="'1'"
      [shrinkable]="true"
      className="min-w-0"
    >
      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Nombre"
          [required]="!camposReadonly()"
          [labelFor]="'role-edit-name'"
        />
        <UiInput
          id="role-edit-name"
          placeholder="p. ej. Gestor de Proyecto"
          [value]="nombre()"
          (valueChange)="patchNombre($event)"
          (blurEvt)="onNombreBlur()"
          [errorMessage]="visibleNombreError()"
          [maxLength]="100"
          [disabled]="camposReadonly()"
        />
        <UiFieldError [message]="visibleNombreError()" />
      </UiFlex>

      <UiFlex direction="column" [gap]="1">
        <UiFormLabel labelText="Descripción" [labelFor]="'role-edit-desc'" />
        <UiTextArea
          id="role-edit-desc"
          [rows]="2"
          placeholder="¿Qué hace este rol dentro de SPSRT?"
          [value]="descripcion()"
          (valueChange)="patchDescripcion($event)"
          (blurEvt)="onDescripcionBlur()"
          [disabled]="camposReadonly()"
        />
        <UiFieldError [message]="visibleDescripcionError()" />
      </UiFlex>

      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Página de inicio (tras el login)"
          [required]="!camposReadonly()"
          [labelFor]="'role-edit-pagina-inicio'"
        />
        <UiSelect
          inputId="role-edit-pagina-inicio"
          [options]="moduloOpciones()"
          [searchable]="true"
          placeholder="Selecciona el módulo que ve el rol tras el login"
          [ngModel]="paginaInicioId()"
          (ngModelChange)="onPaginaInicioChange($event)"
          (blur)="onPaginaInicioBlur()"
          [isDisabled]="camposReadonly()"
        />
        @if (!visiblePaginaInicioError()) {
          <UiLabel
            type="bodyXs"
            color="textWeak"
            [text]="
              camposReadonly()
                ? 'Definida por el sistema y no modificable.'
                : 'El rol siempre debe tener una página de inicio configurada.'
            "
          />
        }
        <UiFieldError [message]="visiblePaginaInicioError()" />
      </UiFlex>
    </UiFlex>

    <UiFlex
      direction="column"
      [gap]="2"
      [flex]="'1'"
      [shrinkable]="true"
      className="min-w-0"
    >
      <UiFlex
        direction="row"
        alignItems="center"
        justifyContent="between"
        className="min-w-0"
      >
        <UiLabel
          type="bodyS"
          weight="semibold"
          color="textStrong"
          text="Permisos de módulos"
        />
        <UiLabel
          type="bodyXs"
          color="textWeak"
          [text]="permisos().length + ' de ' + modules().length + ' módulos'"
        />
      </UiFlex>
      <UiLabel
        type="bodyXs"
        color="textWeak"
        text="Marca los módulos del sidebar a los que este rol puede acceder. La página de inicio siempre queda otorgada."
      />
      <PermissionsMatrix
        [modules]="modules()"
        [selected]="permisos()"
        [readonly]="false"
        [landingCodigo]="landingCodigo()"
        (selectedChange)="onPermisosChange($event)"
      />
    </UiFlex>
  </UiFlex>
</UiModal>
