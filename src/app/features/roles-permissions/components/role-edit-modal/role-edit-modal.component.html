<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="false"
  className="max-w-[640px] p-6 lg:p-8"
  (close)="onCancel()"
>
  @if (role(); as r) {
    <UiFlex direction="column" [gap]="3">
      <UiFlex direction="column" [gap]="1">
        <UiHeader [level]="2" text="Editar rol" />
        <UiLabel
          type="bodyS"
          color="textWeak"
          [text]="'Código ' + r.code + ' (no modificable)'"
        />
      </UiFlex>

      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Nombre"
          [required]="true"
          [labelFor]="'role-edit-name'"
        />
        <UiInput
          id="role-edit-name"
          placeholder="p. ej. Gestor de Proyecto"
          [value]="nombre()"
          (valueChange)="patchNombre($event)"
          (blurEvt)="onNombreBlur()"
          [errorMessage]="visibleNombreError()"
          [maxLength]="100"
        />
        <UiFieldError [message]="visibleNombreError()" />
      </UiFlex>

      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Descripción"
          [labelFor]="'role-edit-desc'"
        />
        <UiTextArea
          id="role-edit-desc"
          [rows]="2"
          placeholder="¿Qué hace este rol dentro de SPSRT?"
          [value]="descripcion()"
          (valueChange)="patchDescripcion($event)"
          (blurEvt)="onDescripcionBlur()"
        />
        <UiFieldError [message]="visibleDescripcionError()" />
      </UiFlex>

      <UiFlex direction="column" [gap]="1">
        <UiFormLabel
          labelText="Página de inicio (tras el login)"
          [required]="true"
          [labelFor]="'role-edit-pagina-inicio'"
        />
        <UiSelect
          inputId="role-edit-pagina-inicio"
          [options]="moduloOpciones()"
          [searchable]="true"
          placeholder="Selecciona el módulo que ve el rol tras el login"
          [ngModel]="paginaInicioId()"
          (ngModelChange)="onPaginaInicioChange($event)"
          (blur)="onPaginaInicioBlur()"
        />
        @if (!visiblePaginaInicioError()) {
          <UiLabel
            type="bodyXs"
            color="textWeak"
            text="El rol siempre debe tener una página de inicio configurada."
          />
        }
        <UiFieldError [message]="visiblePaginaInicioError()" />
      </UiFlex>

      <UiFlex direction="column" [gap]="1" className="mt-1">
        <UiFlex direction="row" alignItems="center" justifyContent="between">
          <UiLabel
            type="bodyS"
            weight="semibold"
            color="textStrong"
            text="Permisos de módulos"
          />
          <UiLabel
            type="bodyXs"
            color="textWeak"
            [text]="permisos().length + ' de ' + modules().length + ' módulos'"
          />
        </UiFlex>
        <UiLabel
          type="bodyXs"
          color="textWeak"
          text="Marca los módulos del sidebar a los que este rol puede acceder. La página de inicio siempre queda otorgada."
        />
        <PermissionsMatrix
          [modules]="modules()"
          [selected]="permisos()"
          [readonly]="false"
          [landingCodigo]="landingCodigo()"
          (selectedChange)="onPermisosChange($event)"
        />
      </UiFlex>

      <UiFlex
        direction="row"
        justifyContent="end"
        [gap]="2"
        className="mt-2 border-t border-gray-200 pt-3 dark:border-gray-800"
      >
        <UiButton variant="secondary" label="Cancelar" (click)="onCancel()" />
        <UiButton
          variant="primary"
          label="Guardar cambios"
          [disabled]="!isValid() || !hasChanges()"
          (click)="onSave()"
        />
      </UiFlex>
    </UiFlex>
  }
</UiModal>
