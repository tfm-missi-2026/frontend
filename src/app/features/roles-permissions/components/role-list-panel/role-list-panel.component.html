<UiLabel
  type="bodyXs"
  color="textWeak"
  weight="medium"
  className="mb-3 uppercase tracking-wider"
  text="Roles del sistema"
/>

<UiFlex direction="column" [gap]="2.5" [noWrap]="true">
  @for (r of roles(); track r.id) {
    <button
      type="button"
      (click)="select.emit(r.id)"
      [class]="itemClasses(r.id)"
      [attr.aria-pressed]="r.id === selectedId()"
    >
      <div class="flex w-full min-w-0 flex-col gap-1 text-left">
        <div class="flex w-full items-start justify-between gap-2">
          <UiLabel
            type="bodyS"
            color="textStrong"
            weight="semibold"
            [text]="r.name"
          />
          <UiBadge
            [variant]="r.id === selectedId() ? 'solid' : 'light'"
            [color]="r.id === selectedId() ? 'primary' : 'light'"
            size="sm"
          >
            {{ r.code }}
          </UiBadge>
        </div>
        <UiLabel type="bodyXs" color="textWeak" [text]="metaLine(r)" />
      </div>
    </button>
  } @empty {
    <UiLabel
      type="bodyS"
      color="textWeak"
      text="No hay roles definidos."
    />
  }
</UiFlex>
