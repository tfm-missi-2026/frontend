<UiLabel
  type="bodyXs"
  color="textWeak"
  weight="medium"
  className="mb-3 uppercase tracking-wider"
  text="Roles del sistema"
/>

<UiFlex direction="column" [gap]="2.5">
  @for (r of roles(); track r.id) {
    <button
      type="button"
      (click)="select.emit(r.id)"
      [class]="itemClasses(r.id)"
      [attr.aria-pressed]="r.id === selectedId()"
    >
      <UiBadge
        [variant]="r.id === selectedId() ? 'solid' : 'light'"
        [color]="r.id === selectedId() ? 'dark' : 'light'"
        size="sm"
      >
        {{ r.code }}
      </UiBadge>
      <UiFlex
        direction="column"
        [gap]="0.5"
        [flex]="'1'"
        [shrinkable]="true"
        className="min-w-0 text-left"
      >
        <UiLabel
          type="bodyS"
          color="textStrong"
          weight="semibold"
          [text]="r.name"
        />
        <UiLabel
          type="bodyXs"
          color="textWeak"
          [text]="metaLine(r)"
        />
      </UiFlex>
      @if (r.id === selectedId()) {
        <IconChevronRight [size]="16" color="var(--color-brand-500)" aria-hidden="true" />
      }
    </button>
  } @empty {
    <UiLabel
      type="bodyS"
      color="textWeak"
      text="No hay roles definidos."
    />
  }
</UiFlex>
