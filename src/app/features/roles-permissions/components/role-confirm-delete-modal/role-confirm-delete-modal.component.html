<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  [showFooter]="true"
  [size]="'md'"
  title="Eliminar rol"
  [subtitle]="subtitleText()"
  [leftAction]="{
    label: 'Cancelar',
    variant: 'secondary',
    icon: IconX
  }"
  [rightAction]="{
    label: 'Eliminar rol',
    variant: 'primary',
    styleType: 'danger',
    icon: IconTrash,
    disabled: !isValid()
  }"
  (close)="onCancel()"
  (action)="onAction($event)"
>
  <UiFlex direction="column" [gap]="3">
    <UiFlex direction="column" [gap]="1">
      <UiFormLabel
        labelText="Motivo de eliminación"
        [required]="true"
        [labelFor]="'role-delete-motivo'"
      />
      <UiTextArea
        id="role-delete-motivo"
        [rows]="3"
        placeholder="Describe brevemente el motivo"
        [value]="motivo()"
        (valueChange)="patchMotivo($event)"
        (blurEvt)="onMotivoBlur()"
      />
      @if (!visibleMotivoError()) {
        <UiLabel
          type="bodyXs"
          color="textWeak"
          text="Quedará registrado en la auditoría del sistema."
        />
      }
      <UiFieldError [message]="visibleMotivoError()" />
    </UiFlex>
  </UiFlex>
</UiModal>
