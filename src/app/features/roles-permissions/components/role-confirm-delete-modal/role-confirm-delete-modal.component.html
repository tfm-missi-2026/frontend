<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="false"
  className="max-w-120 p-6 lg:p-8"
  (close)="onCancel()"
>
  @if (role(); as r) {
    <UiHeader [level]="2" text="Eliminar rol" />
    <UiLabel
      type="bodyS"
      color="textWeak"
      className="mt-1 block"
      [text]="'Vas a eliminar el rol ' + r.name + '. Esta accion no se puede deshacer.'"
    />

    <div className="mt-5 mb-4">
      <UiFormLabel
        labelText="Motivo de eliminacion"
        [required]="true"
        [labelFor]="'role-delete-motivo'"
      />
      <UiTextArea
        id="role-delete-motivo"
        [rows]="3"
        placeholder="Describe brevemente el motivo"
        [value]="motivo()"
        (valueChange)="patchMotivo($event)"
      />
      <UiFieldError [message]="motivoError()" />
    </div>

    <UiFlex
      direction="row"
      justifyContent="end"
      [gap]="2"
      className="mt-4 border-t border-dashed border-gray-200 dark:border-gray-800 pt-4"
    >
      <UiButton
        variant="secondary"
        labelText="Cancelar"
        (click)="onCancel()"
      />
      <UiButton
        variant="primary"
        labelText="Eliminar"
        [disabled]="!isValid()"
        (click)="onConfirm()"
      />
    </UiFlex>
  }
</UiModal>
