<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="false"
  className="max-w-120"
  (close)="onCancel()"
>
  @if (modulo(); as m) {
    <h3 class="mb-1 text-xl font-semibold text-gray-800 dark:text-white/90">
      Deshabilitar modulo
    </h3>
    <UiLabel
      type="bodyS"
      color="textWeak"
      className="mt-1 block"
      [text]="'Vas a deshabilitar el modulo ' + m.nombre + ' (' + m.codigo + '). No aparecera en el sidebar pero el registro se conserva y puede rehabilitarse.'"
    />

    <div class="mt-5 mb-4">
      <UiFormLabel
        labelText="Motivo de deshabilitacion"
        [required]="true"
        [labelFor]="'modulo-disable-motivo'"
      />
      <UiTextArea
        id="modulo-disable-motivo"
        [rows]="3"
        placeholder="Describe brevemente el motivo"
        [value]="motivo()"
        (valueChange)="patchMotivo($event)"
      />
      <UiFieldError [message]="motivoError()" />
    </div>

    <UiFlex
      direction="row"
      justifyContent="end"
      [gap]="2"
      className="mt-4 border-t border-dashed border-gray-200 pt-4 dark:border-gray-800"
    >
      <UiButton
        variant="secondary"
        labelText="Cancelar"
        (click)="onCancel()"
      />
      <UiButton
        variant="primary"
        labelText="Deshabilitar"
        [disabled]="!isValid()"
        (click)="onConfirm()"
      />
    </UiFlex>
  }
</UiModal>
