<UiFlex direction="column" [gap]="5">
  <CommonBreadcrumb [items]="breadcrumbItems" />

  <UiFlex direction="column" [gap]="1">
    <UiHeader [level]="1" text="Avance del proyecto" />
    <UiLabel type="bodyS" color="textWeak">
      Horas estimadas en la línea base frente a horas registradas en la
      bitácora.
    </UiLabel>
  </UiFlex>

  <ProgressToolbar
    [projectOptions]="projectOptions()"
    [projectId]="selectedProjectId()"
    (projectChange)="onProjectChange($event)"
  />

  @if (!selectedProjectId()) {
    <UiSurface
      variant="neutral"
      padding="lg"
      className="border-dashed text-center"
    >
      <UiFlex direction="column" alignItems="center" [gap]="2">
        <UiHeader [level]="4" text="Selecciona un proyecto." />
        <UiLabel type="bodyS" color="textWeak">
          Elige un proyecto arriba para ver su avance contra la línea base.
        </UiLabel>
      </UiFlex>
    </UiSurface>
  } @else if (!progress().hasBaseline) {
    <UiSurface
      variant="neutral"
      padding="lg"
      className="border-dashed text-center"
    >
      <UiFlex direction="column" alignItems="center" [gap]="3">
        <UiHeader
          [level]="4"
          text="Este proyecto aún no tiene una línea base congelada."
        />
        <UiLabel type="bodyS" color="textWeak">
          Congélala en Planificación para medir el avance contra lo estimado.
        </UiLabel>
        <UiButton
          variant="primary"
          label="Ir a Planificación"
          (click)="onGoToPlanning()"
        />
      </UiFlex>
    </UiSurface>
  } @else {
    <ProgressBaseline
      [baselineLabel]="progress().baselineLabel"
      [baselineDate]="progress().baselineDate"
      [estimatedHours]="progress().estimatedHours"
      [loggedHours]="progress().loggedHours"
      [progressPct]="progress().progressPct"
    />

    <ProgressTable
      [rows]="progress().rows"
      [totalEstimatedHours]="progress().estimatedHours"
      [totalLoggedHours]="progress().loggedHours"
      [totalProgressPct]="progress().progressPct"
    />
  }
</UiFlex>
