<UiFlex
  direction="row"
  alignItems="center"
  [gap]="12"
  className="flex-wrap"
>
  <UiFlex direction="row" alignItems="center" [gap]="6" className="flex-1 min-w-70">
    <UiInput
      type="text"
      placeholder="Buscar por código o nombre…"
      [leftIcon]="IconSearchLightComponent"
      [value]="searchTerm()"
      (valueChange)="searchChange.emit($event)"
    ></UiInput>
  </UiFlex>

  <UiFlex direction="row" alignItems="center" className="min-w-45">
    <UiSelect
      [options]="statusOptions()"
      placeholder="Estado: Todos"
      [searchable]="false"
      [isClearable]="true"
      [ngModel]="statusValue()"
      (ngModelChange)="statusChange.emit(asString($event))"
    ></UiSelect>
  </UiFlex>
</UiFlex>
