<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  [showFooter]="true"
  className="max-w-115"
  title="Recurso en sobrecarga"
  subtitle="RF-06 · verificación de capacidad"
  [leftAction]="{ label: 'Cancelar', variant: 'secondary', icon: IconX }"
  [rightAction]="{
    label: 'Confirmar de todas formas',
    variant: 'primary',
    icon: IconCheck,
  }"
  (close)="cancel.emit()"
  (action)="onAction($event)"
>
  <UiFlex direction="column" [gap]="4">
    <UiAlert
      variant="warning"
      [message]="'Excede la capacidad en ' + excessHours() + ' h.'"
    />

    <UiLabel type="bodyS" color="textStrong" [text]="explanationLabel()" />

    <UiSurface variant="neutral" padding="md">
      <UiFlex direction="column" [gap]="2">
        @for (row of rows(); track row.label) {
          <UiFlex direction="row" alignItems="center" justifyContent="between">
            <UiLabel type="bodyXs" color="textWeak" [text]="row.label" />
            <UiLabel
              type="bodyXs"
              weight="semibold"
              color="textStrong"
              [text]="row.value"
            />
          </UiFlex>
        }
      </UiFlex>
    </UiSurface>

    <UiLabel type="bodyXs" color="textWeak">
      Confirmar registra la asignación aunque supere la capacidad del recurso.
    </UiLabel>
  </UiFlex>
</UiModal>
