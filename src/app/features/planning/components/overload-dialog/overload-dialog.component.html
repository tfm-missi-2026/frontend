<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  [showFooter]="true"
  className="max-w-115"
  title="Recurso en sobrecarga"
  subtitle="Verificación de capacidad"
  [rightAction]="{ label: 'Entendido', variant: 'primary', icon: IconCheck }"
  (close)="cancel.emit()"
  (action)="cancel.emit()"
>
  <UiFlex direction="column" [gap]="4">
    <UiAlert
      variant="warning"
      [message]="'Excede la capacidad en ' + excessHours() + ' h.'"
    />

    <UiLabel type="bodyS" color="textStrong" [text]="explanationLabel()" />

    <UiSurface variant="neutral" padding="md">
      <UiFlex direction="column" [gap]="2">
        @for (row of rows(); track row.label) {
          <UiFlex direction="row" alignItems="center" justifyContent="between">
            <UiLabel type="bodyXs" color="textWeak" [text]="row.label" />
            <UiLabel
              type="bodyXs"
              weight="semibold"
              color="textStrong"
              [text]="row.value"
            />
          </UiFlex>
        }
      </UiFlex>
    </UiSurface>

    <UiLabel type="bodyXs" color="textWeak">
      No se puede asignar por encima de la capacidad. Elige otra fecha de inicio u otro recurso.
    </UiLabel>
  </UiFlex>
</UiModal>
