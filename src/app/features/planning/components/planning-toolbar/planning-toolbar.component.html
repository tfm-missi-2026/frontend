<UiFlex
  direction="row"
  alignItems="center"
  justifyContent="between"
  [gap]="3"
  className="flex-wrap"
>
  <UiFlex direction="row" alignItems="center" [gap]="3" className="flex-wrap">
    <UiSelect
      [options]="projectOptions()"
      placeholder="Proyecto: selecciona…"
      [searchable]="false"
      [ngModel]="projectId()"
      (ngModelChange)="projectChange.emit(asString($event))"
      width="w-80"
      menuPosition="fixed"
    ></UiSelect>
    <UiButton
      variant="primary"
      label="Nueva asignación"
      labelText="Nueva asignación"
      [LeftIcon]="plusIcon"
      [disabled]="!projectId()"
      [tooltip]="projectId() ? undefined : 'Selecciona un proyecto primero'"
      (click)="create.emit()"
    />
  </UiFlex>

  <UiFlex direction="row" alignItems="center" [gap]="3" className="flex-wrap">
    @if (allFrozen()) {
      <UiBadge variant="light" color="success" size="md">
        Subproyectos congelados
      </UiBadge>
    } @else if (projectId()) {
      <UiBadge
        variant="light"
        [color]="
          activeTaskCount() > 0 && assignedTaskCount() === activeTaskCount()
            ? 'success'
            : 'warning'
        "
        size="md"
      >
        Tareas asignadas: {{ assignedTaskCount() }}/{{ activeTaskCount() }}
      </UiBadge>
    }
    <UiButton
      variant="secondary"
      label="Congelar línea base"
      labelText="Congelar línea base"
      [disabled]="!canFreeze()"
      [tooltip]="freezeHint()"
      (click)="freeze.emit()"
    />
  </UiFlex>
</UiFlex>
