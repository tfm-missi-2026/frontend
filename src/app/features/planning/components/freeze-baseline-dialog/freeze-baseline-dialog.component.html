<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  [showFooter]="true"
  className="max-w-115"
  title="Congelar línea base"
  subtitle="Plan de referencia del proyecto"
  [leftAction]="{ label: 'Cancelar', variant: 'secondary', icon: IconX }"
  [rightAction]="{
    label: 'Congelar',
    variant: 'primary',
    icon: IconCheck,
    disabled: saving(),
    loading: saving(),
  }"
  (close)="cancel.emit()"
  (action)="onAction($event)"
>
  <UiFlex direction="column" [gap]="4">
    <UiLabel
      type="bodyS"
      color="textStrong"
      text="Se congelarán los subproyectos que tengan todas sus tareas asignadas. El módulo Avance comparará las horas registradas contra lo congelado."
    />

    <UiSurface variant="neutral" padding="md">
      <UiFlex direction="column" [gap]="2">
        @for (row of rows(); track row.label) {
          <UiFlex direction="row" alignItems="center" justifyContent="between">
            <UiLabel type="bodyXs" color="textWeak" [text]="row.label" />
            <UiLabel
              type="bodyXs"
              weight="semibold"
              color="textStrong"
              [text]="row.value"
            />
          </UiFlex>
        }
      </UiFlex>
    </UiSurface>

    <UiLabel type="bodyXs" color="textWeak">
      Un subproyecto se congela una sola vez y no se puede editar. Los cambios se registran como variaciones, y el trabajo nuevo, en otro subproyecto.
    </UiLabel>
  </UiFlex>
</UiModal>
