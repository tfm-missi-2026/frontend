<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  [showFooter]="true"
  [size]="'lg'"
  [title]="heading()"
  subtitle="Vincula un recurso técnico con una tarea del proyecto seleccionado."
  [leftAction]="{
    label: 'Cancelar',
    variant: 'secondary',
    icon: IconX,
  }"
  [rightAction]="{
    label: mode() === 'create' ? 'Crear asignación' : 'Guardar cambios',
    variant: 'primary',
    icon: IconCheck,
    disabled: saving() || formInvalid(),
    loading: saving(),
  }"
  (close)="onCancel()"
  (action)="onAction($event)"
>
  <UiFlex direction="column" [gap]="4">
    @if (validationMessage(); as msg) {
      <UiAlert variant="error" [message]="msg" />
    }

    <UiFlex direction="column" [gap]="1">
      <UiFormLabel
        labelText="Tarea"
        labelFor="assignment-task"
        [required]="true"
      />
      <UiSelect
        inputId="assignment-task"
        [options]="taskOptions()"
        placeholder="Selecciona una tarea…"
        [searchable]="false"
        [ngModel]="form().taskId"
        (ngModelChange)="onTaskChange($event)"
        [errorMessage]="taskError() ?? undefined"
      />
      @if (taskError(); as msg) {
        <UiFieldError [message]="msg" />
      } @else {
        <UiLabel
          type="bodyXs"
          color="textWeak"
          text="Tareas de los subproyectos del proyecto seleccionado."
        />
      }
    </UiFlex>

    <UiFlex direction="column" [gap]="1">
      <UiFormLabel
        labelText="Recurso técnico"
        labelFor="assignment-resource"
        [required]="true"
      />
      <UiSelect
        inputId="assignment-resource"
        [options]="resourceOptions()"
        placeholder="Selecciona un recurso…"
        [searchable]="false"
        [ngModel]="form().resourceId"
        (ngModelChange)="onResourceChange($event)"
        [errorMessage]="resourceError() ?? undefined"
      />
      @if (resourceError(); as msg) {
        <UiFieldError [message]="msg" />
      } @else {
        <UiLabel
          type="bodyXs"
          color="textWeak"
          text="Solo usuarios con rol Recurso Técnico."
        />
      }
    </UiFlex>

    <UiGrid [columns]="2" gap="gap-4">
      <UiFlex direction="column" [gap]="1" className="min-w-0">
        <UiFormLabel
          labelText="Fecha inicio"
          labelFor="assignment-start"
          [required]="true"
        />
        <UiDatePicker
          inputId="assignment-start"
          mode="single"
          dateFormat="Y-m-d"
          placeholder="aaaa-mm-dd"
          [value]="form().startDate"
          (valueChange)="onStartDateChange($event)"
        />
        @if (startError(); as msg) {
          <UiFieldError [message]="msg" />
        }
      </UiFlex>

      <UiFlex direction="column" [gap]="1" className="min-w-0">
        <UiFormLabel
          labelText="Fecha fin"
          labelFor="assignment-end"
          [required]="true"
        />
        <UiDatePicker
          inputId="assignment-end"
          mode="single"
          dateFormat="Y-m-d"
          placeholder="aaaa-mm-dd"
          [value]="form().endDate"
          (valueChange)="onEndDateChange($event)"
        />
        @if (endError(); as msg) {
          <UiFieldError [message]="msg" />
        }
      </UiFlex>
    </UiGrid>

    @if (dateRangeError(); as msg) {
      <UiFieldError [message]="msg" />
    }

    <UiFlex direction="column" [gap]="1">
      <UiFormLabel
        labelText="Horas por día"
        labelFor="assignment-hours"
        [required]="true"
      />
      <UiInput
        id="assignment-hours"
        type="number"
        placeholder="p. ej. 3"
        sufix="h/día"
        [value]="hoursPerDay()"
        (valueChange)="onHoursChange($event)"
        [errorMessage]="hoursError() ?? undefined"
      />
      @if (hoursError(); as msg) {
        <UiFieldError [message]="msg" />
      } @else {
        <UiLabel type="bodyXs" color="textWeak" [text]="jornadaLabel()" />
      }
    </UiFlex>
  </UiFlex>
</UiModal>
