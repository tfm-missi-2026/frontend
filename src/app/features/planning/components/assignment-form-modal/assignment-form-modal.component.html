<UiModal
  [isOpen]="isOpen()"
  [showCloseButton]="true"
  [showFooter]="true"
  [size]="'lg'"
  [title]="heading()"
  subtitle="Vincula un recurso técnico con una tarea del proyecto seleccionado."
  [leftAction]="{
    label: 'Cancelar',
    variant: 'secondary',
    icon: IconX,
  }"
  [rightAction]="{
    label: mode() === 'create' ? 'Crear asignación' : 'Guardar cambios',
    variant: 'primary',
    icon: IconCheck,
    disabled: saving() || formInvalid(),
    loading: saving(),
  }"
  (close)="onCancel()"
  (action)="onAction($event)"
>
  <UiFlex direction="column" [gap]="4" [noWrap]="true">
    @if (validationMessage(); as msg) {
      <UiAlert variant="error" [message]="msg" />
    }

    <UiFlex direction="column" [gap]="1" [noWrap]="true">
      <UiFormLabel
        labelText="Tarea"
        labelFor="assignment-task"
        [required]="true"
      />
      <UiSelect
        inputId="assignment-task"
        [options]="taskOptions()"
        placeholder="Selecciona una tarea…"
        [searchable]="false"
        [ngModel]="form().taskId"
        (ngModelChange)="onTaskChange($event)"
        [errorMessage]="taskError() ?? undefined"
      />
      @if (taskError(); as msg) {
        <UiFieldError [message]="msg" />
      } @else {
        <UiLabel
          type="bodyXs"
          color="textWeak"
          text="Tareas de los subproyectos del proyecto seleccionado."
        />
      }
    </UiFlex>

    <UiFlex direction="column" [gap]="1" [noWrap]="true">
      <UiFormLabel
        labelText="Recurso técnico"
        labelFor="assignment-resource"
        [required]="true"
      />
      <UiSelect
        inputId="assignment-resource"
        [options]="resourceOptions()"
        placeholder="Selecciona un recurso…"
        [searchable]="false"
        [ngModel]="form().resourceId"
        (ngModelChange)="onResourceChange($event)"
        [errorMessage]="resourceError() ?? undefined"
      />
      @if (resourceError(); as msg) {
        <UiFieldError [message]="msg" />
      } @else {
        <UiLabel
          type="bodyXs"
          color="textWeak"
          text="Solo usuarios con rol Recurso Técnico."
        />
      }
    </UiFlex>

    <UiFlex direction="column" [gap]="1" [noWrap]="true">
      <UiFormLabel
        labelText="Fecha inicio"
        labelFor="assignment-start"
        [required]="true"
      />
      <UiDatePicker
        inputId="assignment-start"
        mode="single"
        dateFormat="d/m/Y"
        placeholder="dd/mm/aaaa"
        [value]="form().startDate"
        (valueChange)="onStartDateChange($event)"
      />
      @if (startError(); as msg) {
        <UiFieldError [message]="msg" />
      } @else {
        <UiLabel type="bodyXs" color="textWeak" [text]="scheduleLabel()" />
      }
    </UiFlex>
  </UiFlex>
</UiModal>
