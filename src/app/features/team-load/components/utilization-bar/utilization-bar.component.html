<div class="flex w-full min-w-40 items-center gap-3">
  <div
    class="relative h-5 w-full min-w-30 overflow-hidden rounded border-2 border-gray-300 bg-white dark:border-gray-700 dark:bg-gray-900"
  >
    <div [class]="fillClasses()" [style.width.%]="fillWidthPct()"></div>
    <div
      class="absolute -top-1 -bottom-1 w-0 border-l-2 border-dashed border-gray-500"
      [style.left.%]="markPos"
    ></div>
  </div>
  <UiLabel
    type="bodyS"
    weight="semibold"
    color="textStrong"
    className="min-w-16 whitespace-nowrap font-mono"
  >
    {{ labelText() }}
  </UiLabel>
</div>
