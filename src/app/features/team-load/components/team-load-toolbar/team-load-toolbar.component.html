<UiSurface
  variant="neutral"
  padding="md"
  className="border border-gray-200 dark:border-gray-800"
>
  <UiFlex direction="row" alignItems="end" [gap]="4" className="flex-wrap">
    <UiDatePicker
      id="tl-from"
      labelText="Desde"
      placeholder="dd/mm/aaaa"
      dateFormat="d/m/Y"
      width="w-40"
      [value]="fromIso()"
      (valueChange)="onFromPick($event)"
    />

    <UiDatePicker
      id="tl-to"
      labelText="Hasta"
      placeholder="dd/mm/aaaa"
      dateFormat="d/m/Y"
      width="w-40"
      [value]="toIso()"
      (valueChange)="onToPick($event)"
    />

    <UiFlex direction="column" [gap]="1" className="min-w-60">
      <UiFormLabel labelText="Proyecto (opcional)" labelFor="tl-project" />
      <UiSelect
        inputId="tl-project"
        [options]="projectOptions()"
        placeholder="Todos"
        [searchable]="false"
        [isClearable]="true"
        [ngModel]="projectId()"
        (ngModelChange)="projectChange.emit(asString($event))"
      />
    </UiFlex>

    <UiButton variant="primary" label="Consultar" (click)="consult.emit()" />
  </UiFlex>
</UiSurface>
