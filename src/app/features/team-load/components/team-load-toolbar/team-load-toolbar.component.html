<UiSurface
  variant="neutral"
  padding="md"
  className="border border-gray-200 dark:border-gray-800"
>
  <UiFlex direction="row" alignItems="end" [gap]="6" className="flex-wrap">
    <UiDatePicker
      id="tl-from"
      labelText="Desde"
      placeholder="aaaa-mm-dd"
      dateFormat="Y-m-d"
      width="w-40"
      [value]="fromIso()"
      (valueChange)="onFromPick($event)"
    />

    <UiDatePicker
      id="tl-to"
      labelText="Hasta"
      placeholder="aaaa-mm-dd"
      dateFormat="Y-m-d"
      width="w-40"
      [value]="toIso()"
      (valueChange)="onToPick($event)"
    />

    <UiFlex direction="column" [gap]="1" className="min-w-50">
      <UiFormLabel labelText="Proyecto (opcional)" labelFor="tl-project" />
      <UiSelect
        inputId="tl-project"
        [options]="projectOptions()"
        placeholder="Todos"
        [searchable]="false"
        [isClearable]="true"
        [ngModel]="projectId()"
        (ngModelChange)="projectChange.emit(asString($event))"
      />
    </UiFlex>

    <UiButton variant="primary" label="Consultar" (click)="consult.emit()" />

    <UiFlex
      className="flex-1 min-w-50"
      direction="row"
      justifyContent="end"
      alignItems="end"
    >
      <UiLabel
        type="bodyXs"
        color="textWeak"
        className="italic text-right"
        [text]="'El filtro por proyecto acota a sus tareas · RF-07'"
      />
    </UiFlex>
  </UiFlex>
</UiSurface>
