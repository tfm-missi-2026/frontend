<UiSurface
  variant="neutral"
  padding="none"
  className="border border-gray-200 dark:border-gray-800"
  ariaLabel="Tabla de carga del equipo"
>
  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm text-gray-700 dark:text-gray-300">
      <thead
        class="border-b border-gray-200 text-xs uppercase tracking-wide text-gray-500 dark:border-gray-800 dark:text-gray-400"
      >
        <tr>
          <th class="w-52 px-4 py-3 font-medium">Recurso técnico</th>
          <th class="w-26 px-4 py-3 text-center font-medium">Planif.</th>
          <th class="w-26 px-4 py-3 text-center font-medium">Registr.</th>
          <th class="w-24 px-4 py-3 text-center font-medium">Tareas act.</th>
          <th class="px-4 py-3 font-medium">% Utilización</th>
          <th class="w-32 px-4 py-3 text-center font-medium">Estado</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
        @for (row of rows(); track row.resourceId) {
          <tr class="hover:bg-gray-50 dark:hover:bg-white/3">
            <td class="px-4 py-3.5">
              <UiFlex direction="row" alignItems="center" [gap]="8">
                <UiSurface
                  variant="neutral"
                  padding="none"
                  className="h-9 w-9 shrink-0 rounded-full bg-gray-100 dark:bg-gray-800"
                  ariaLabel="Avatar del recurso"
                ></UiSurface>
                <UiFlex direction="column" [gap]="0" className="min-w-0">
                  <UiLabel
                    type="bodyS"
                    weight="semibold"
                    color="textStrong"
                    [text]="row.resourceName"
                  />
                  <UiLabel
                    type="bodyXs"
                    color="textWeak"
                    [text]="row.resourceRole"
                  />
                </UiFlex>
              </UiFlex>
            </td>
            <td class="px-4 py-3.5 text-center">
              <UiLabel
                type="bodyS"
                weight="semibold"
                [color]="row.hasPlan ? 'textStrong' : 'textWeakest'"
                className="font-mono whitespace-nowrap"
              >
                {{ asHours(row.plannedHours, row.hasPlan) }}
              </UiLabel>
            </td>
            <td class="px-4 py-3.5 text-center">
              <UiLabel
                type="bodyS"
                weight="semibold"
                color="textStrong"
                className="font-mono whitespace-nowrap"
              >
                {{ row.loggedHours }} h
              </UiLabel>
            </td>
            <td class="px-4 py-3.5 text-center">
              <UiLabel
                type="bodyS"
                weight="bold"
                color="textStrong"
                className="font-mono inline-flex items-center justify-center border-2 border-gray-400 rounded-md px-2 py-0.5 text-sm dark:border-gray-600"
              >
                {{ row.activeTaskCount }}
              </UiLabel>
            </td>
            <td class="px-4 py-3.5">
              <UtilizationBar
                [utilizationPct]="row.utilizationPct"
                [hasPlan]="row.hasPlan"
                [isOverload]="row.isOverload"
              />
            </td>
            <td class="px-4 py-3.5 text-center">
              @if (row.isOverload) {
                <UiBadge variant="solid" color="error" size="md">
                  Sobrecarga
                </UiBadge>
              } @else {
                <UiBadge variant="light" color="success" size="md">
                  Normal
                </UiBadge>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</UiSurface>
