<UiGrid [columns]="3" gap="gap-4">
  <CommonKpiCard
    label="Recursos"
    [value]="totalResources()"
    sub="en el rango consultado"
  />
  <CommonKpiCard
    [alert]="overloadCount() > 0"
    label="En sobrecarga"
    [value]="overloadCount()"
    sub="% utilización > 100"
  />
  <CommonKpiCard
    label="% Utilización media"
    [value]="averageUtilizationPct()"
    valueSuffix="%"
    sub="promedio de recursos con plan"
    [progressPct]="averageUtilizationPct()"
  />
</UiGrid>
