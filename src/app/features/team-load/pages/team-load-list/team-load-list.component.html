<UiFlex direction="column" [gap]="5">
  <CommonBreadcrumb [items]="breadcrumbItems" />

  <UiFlex direction="column" [gap]="1">
    <UiHeader [level]="1" text="Carga del equipo" />
    <UiLabel type="bodyS" color="textWeak">
      Horas planificadas frente a horas registradas por recurso, en un rango de
      fechas.
    </UiLabel>
  </UiFlex>

  <TeamLoadToolbar
    [fromIso]="fromIso()"
    [toIso]="toIso()"
    [projectOptions]="projectOptions()"
    [projectId]="projectId()"
    (fromChange)="onFromChange($event)"
    (toChange)="onToChange($event)"
    (projectChange)="onProjectChange($event)"
    (consult)="onConsult()"
  />

  <TeamLoadSummary
    [totalResources]="totalResources()"
    [overloadCount]="overloadCount()"
    [averageUtilizationPct]="averageUtilizationPct()"
  />

  @if (workloads().length === 0) {
    <UiSurface
      variant="neutral"
      padding="lg"
      className="border-dashed text-center"
    >
      <UiFlex direction="column" alignItems="center" [gap]="1">
        <UiHeader [level]="4" text="No hay datos para el rango." />
        <UiLabel type="bodyS" color="textWeak">
          Prueba con otro rango de fechas.
        </UiLabel>
      </UiFlex>
    </UiSurface>
  } @else {
    <UiFlex direction="column" [gap]="2" [noWrap]="true">
      <UiLabel type="bodyXs" color="textWeak">
        Rango consultado: {{ rangeLabel() }}
      </UiLabel>
      <TeamLoadTable [rows]="workloads()" />
    </UiFlex>
  }
</UiFlex>
