<UiFlex
  direction="row"
  alignItems="center"
  justifyContent="between"
  [gap]="3"
  className="flex-wrap"
>
  <UiFlex
    direction="row"
    alignItems="center"
    [gap]="3"
    className="flex-wrap flex-1 min-w-0"
  >
    <UiFlex direction="row" alignItems="center" className="min-w-70">
      <UiInput
        type="text"
        placeholder="Buscar por tarea o descripción…"
        [leftIcon]="IconSearchLightComponent"
        [value]="searchTerm()"
        (valueChange)="searchChange.emit($event)"
      ></UiInput>
    </UiFlex>

    <UiFlex direction="row" alignItems="center" className="min-w-40">
      <UiSelect
        [options]="typeOptions()"
        placeholder="Tipo: Todos"
        [searchable]="false"
        [isClearable]="true"
        [ngModel]="typeValue()"
        (ngModelChange)="typeChange.emit(asString($event))"
      ></UiSelect>
    </UiFlex>

    <UiFlex direction="row" alignItems="center" className="min-w-45">
      <UiSelect
        [options]="statusOptions()"
        placeholder="Situación: Todas"
        [searchable]="false"
        [isClearable]="true"
        [ngModel]="statusValue()"
        (ngModelChange)="statusChange.emit(asString($event))"
      ></UiSelect>
    </UiFlex>
  </UiFlex>

  <UiButton
    variant="primary"
    label="Reportar variación"
    labelText="Reportar variación"
    [LeftIcon]="plusIcon"
    (click)="report.emit()"
  />
</UiFlex>
