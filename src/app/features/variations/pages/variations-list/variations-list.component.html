<UiFlex direction="column" [gap]="5">
  <CommonBreadcrumb [items]="breadcrumbItems" />

  <UiFlex direction="column" [gap]="1">
    <UiHeader [level]="1" text="Variaciones" />
    <UiLabel type="bodyS" color="textWeak">
      Cambios de alcance, plazo o recursos sobre la línea base congelada.
    </UiLabel>
  </UiFlex>

  <VariationsToolbar
    [searchTerm]="searchTerm()"
    [typeOptions]="VARIATION_TYPE_FILTER_OPTIONS"
    [typeValue]="filterType()"
    [statusOptions]="VARIATION_STATUS_FILTER_OPTIONS"
    [statusValue]="filterStatus()"
    (searchChange)="onSearchChange($event)"
    (typeChange)="onTypeFilterChange($event)"
    (statusChange)="onStatusFilterChange($event)"
    (report)="openReport()"
  />

  <VariationsTable
    [rows]="rows()"
    emptyText="No hay variaciones con esos filtros. Ajusta los filtros o reporta una nueva variación."
    (view)="onView($event)"
    [canManage]="canManage()"
    (resolve)="onResolve($event)"
    (remove)="deleteTarget.set($event)"
  />

  @if (rows().length > 0) {
    <UiSurface variant="neutral" padding="md">
      <UiFlex
        direction="row"
        alignItems="center"
        justifyContent="between"
        [gap]="12"
        className="flex-wrap"
      >
        <UiFlex direction="row" alignItems="center" [gap]="8" className="flex-wrap">
          <UiLabel type="bodyXs" weight="medium" color="textWeak" className="uppercase">
            Conteo
          </UiLabel>
          <UiBadge
            variant="light"
            color="warning"
            size="md"
            className="border border-dashed border-warning-300 dark:border-warning-700"
          >
            {{ pendingCount() }} pendientes
          </UiBadge>
          <UiBadge variant="solid" color="success" size="md">
            {{ approvedCount() }} aprobadas
          </UiBadge>
          <UiBadge variant="solid" color="error" size="md">
            {{ rejectedCount() }} rechazadas
          </UiBadge>
        </UiFlex>
      </UiFlex>
    </UiSurface>
  }
</UiFlex>

@if (deleteTarget(); as v) {
  <DeleteVariationDialog
    [variation]="v"
    [saving]="deleteSaving()"
    (confirm)="onDeleteConfirm(v, $event)"
    (cancel)="deleteTarget.set(null)"
  />
}

<ReportVariationModal
  [isOpen]="reportOpen()"
  [projects]="projectOptions()"
  [subprojects]="subprojectOptions()"
  [tasks]="taskOptions()"
  [reportedBy]="currentReporter()"
  (save)="onReportSubmit($event)"
  (close)="closeReport()"
/>

@if (selectedVariation(); as v) {
  <ResolveVariationModal
    [isOpen]="resolveOpen()"
    [mode]="resolveMode()"
    [variation]="v"
    [resolvedBy]="currentResolver()"
    (resolve)="onResolveSubmit($event)"
    (close)="closeResolve()"
  />
}
