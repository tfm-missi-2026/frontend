<UiFlex direction="column" [gap]="6">
  <UiFlex direction="column" alignItems="center" [gap]="6">
    <UiLabel type="HeadingL" weight="bold" color="textStrong">
      SPSRT
    </UiLabel>
    <UiLabel type="bodyXs" color="textWeak" align="center">
      Planificación y Seguimiento de Recursos Técnicos
    </UiLabel>
  </UiFlex>

  <UiForm (submit)="onSubmit($event)" className="flex flex-col gap-4">
    <UiInput id="signin-email" name="email" type="email" labelText="Correo electrónico"
      placeholder="nombre.apellido@institucion.gob.pe" [required]="true" [value]="email()"
      (valueChange)="onEmailChange($event)"></UiInput>

    <UiInput id="signin-password" name="password" type="password" labelText="Contraseña" placeholder="••••••••"
      [required]="true" [showPasswordToggle]="true" [value]="password()" (valueChange)="onPasswordChange($event)">
    </UiInput>

    <UiButton variant="primary" [fullWidth]="true" [isSubmit]="true" [isLoading]="loading()" [disabled]="loading()"
      label="Entrar" (click)="onSubmit()"></UiButton>

    <UiFlex justifyContent="center">
      <UiLink variant="primary" size="sm" underline="hover" (click)="forgotPasswordRequested.emit()">
        ¿Olvidó su contraseña?
      </UiLink>
    </UiFlex>
  </UiForm>
  <UiFlex justifyContent="center">
    <UiLabel type="bodyXxs" color="textWeakest" className="font-mono" [text]="'v0.1 · SPSRT'">
    </UiLabel>
  </UiFlex>
</UiFlex>
