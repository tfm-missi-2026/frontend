<UiFlex direction="column" [gap]="20">
  <UiFlex direction="column" alignItems="center" [gap]="6" className="mb-2">
    <UiLabel type="HeadingL" weight="bold" color="textStrong">
      SPSRT
    </UiLabel>
    <UiLabel type="bodyXs" color="textWeak" align="center">
      Planificación y Seguimiento de Recursos Técnicos
    </UiLabel>
  </UiFlex>

  <form (submit)="onSubmit($event)" class="contents">
    <div>
      <UiLabel type="bodyXs" weight="medium" color="textStrong" className="mb-1.5 block uppercase">
        Correo electrónico
      </UiLabel>
      <UiInput id="signin-email" name="email" type="email" placeholder="nombre.apellido@institucion.gob.pe"
        [required]="true" [value]="email()" (valueChange)="onEmailChange($event)"></UiInput>
    </div>

    <div>
      <UiLabel type="bodyXs" weight="medium" color="textStrong" className="mb-1.5 block uppercase">
        Contraseña
      </UiLabel>
      <UiInput id="signin-password" name="password" type="password" placeholder="••••••••" [required]="true"
        [showPasswordToggle]="true" [value]="password()" (valueChange)="onPasswordChange($event)"></UiInput>
    </div>

    @if (errorMessage(); as msg) {
    <UiAlert variant="error" [message]="msg"></UiAlert>
    }

    <UiButton variant="primary" [fullWidth]="true" [isSubmit]="true" [isLoading]="loading()" label="Entrar"
      (click)="onSubmit()"></UiButton>

    <UiFlex justifyContent="center">
      <button type="button"
        class="text-sm font-medium text-brand-500 underline-offset-2 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/40 rounded-sm"
        (click)="forgotPasswordRequested.emit()">
        ¿Olvidó su contraseña?
      </button>
    </UiFlex>
  </form>
</UiFlex>

<UiFlex justifyContent="center" className="mt-6">
  <UiLabel type="bodyXxs" color="textWeakest" className="font-mono" [text]="'v0.1 · SPSRT'">
  </UiLabel>
</UiFlex>
