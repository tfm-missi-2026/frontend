<UiFlex direction="column" [gap]="5">
  <CommonBreadcrumb
    [items]="[{ label: 'Operación' }, { label: 'Dashboard Jefe' }]"
  />

  <UiFlex
    direction="row"
    alignItems="center"
    justifyContent="between"
    [gap]="3"
    className="flex-wrap"
  >
    <UiFlex direction="column" [gap]="6" className="flex-1 min-w-60">
      <UiHeader [level]="1" [text]="dashboard().greeting" />
      <UiLabel type="bodyS" color="textWeak">
        Visión del área · periodo
        
          {{ currentPeriod().label }}
        
        · {{ dashboard().totalUsersActive }} recursos ·
        {{ dashboard().projectsTotal }} proyectos activos.
      </UiLabel>
    </UiFlex>
    <CommonPeriodSelector
      [periods]="periods"
      [periodId]="periodId()"
      (periodChange)="onPeriodChange($event)"
    />
  </UiFlex>

  <UiGrid [columns]="4" gap="gap-4">
    <CommonKpiCard
      [alert]="true"
      label="Recursos en sobrecarga"
      [value]="dashboard().overloadResourcesCount"
      [valueSuffix]="' de ' + dashboard().totalUsersActive"
      sub="% utilización &gt; 100"
      linkLabel="Ver carga del equipo →"
      [linkTo]="'/app/operacion/carga-equipo'"
    />
    <CommonKpiCard
      label="% Utilización media del equipo"
      [value]="dashboard().teamAverageUtilizationPct"
      valueSuffix="%"
      sub="línea = 100% capacidad"
      [progressPct]="dashboard().teamAverageUtilizationPct"
    />
    <CommonKpiCard
      label="Proyectos del área"
      [value]="dashboard().projectsTotal"
      valueSuffix=" activos"
      sub="proyectos en curso"
      linkLabel="Ver proyectos →"
      [linkTo]="'/app/operacion/proyectos'"
    />
    <CommonKpiCard
      label="Variaciones pendientes"
      [value]="dashboard().variationsTotal"
      sub="por resolver en el área"
      linkLabel="Ver variaciones →"
      [linkTo]="'/app/operacion/variaciones'"
    />
  </UiGrid>

  <UiGrid [columns]="2" gap="gap-5">
    <AreaLoadChart [workloads]="dashboard().teamWorkloads" />
    <AreaAlerts
      [overloads]="overloadsList()"
      [variations]="dashboard().pendingVariations"
    />
  </UiGrid>
</UiFlex>
