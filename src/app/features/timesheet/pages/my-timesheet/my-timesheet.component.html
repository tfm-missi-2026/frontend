<UiFlex direction="column" [gap]="5">
  <CommonBreadcrumb [items]="breadcrumbItems" />

  <UiFlex direction="column" [gap]="1">
    <UiHeader [level]="1" text="Mi bitácora" />
    <UiLabel type="bodyS" color="textWeak">
      Registra tu dedicación real en bloques de tiempo. Cada bloque es trabajo
      en una tarea o participación en una actividad, nunca ambos.
    </UiLabel>
  </UiFlex>

  <UiFlex
    direction="row"
    alignItems="center"
    justifyContent="between"
    [gap]="3"
    className="flex-wrap"
  >
    <TimesheetToolbar
      [mode]="mode()"
      [date]="date()"
      (modeChange)="onModeChange($event)"
      (dateChange)="onDateChange($event)"
    />
    <UiButton
      variant="primary"
      label="Registrar bloque"
      labelText="Registrar bloque"
      [LeftIcon]="IconPlusSimpleComponent"
      (click)="openCreate()"
    />
  </UiFlex>

  @if (showAlert(); as msg) {
    <UiAlert variant="success" [message]="msg" />
  }

  <TimesheetTimeline
    [entries]="visibleEntries()"
    [heading]="timelineHeading()"
    [taskOptions]="taskOptions()"
    (edit)="openEdit($event)"
    (remove)="onDeleteEntry($event)"
    (register)="openCreate()"
  />
</UiFlex>

@if (mode() === "month") {
  <UiModal
    [isOpen]="true"
    [showCloseButton]="true"
    size="4xl"
    className="w-full max-w-7xl"
    title="Bitácora del mes"
    (close)="mode.set('day')"
  >
    <TimesheetMonthCalendar
      [entries]="entries()"
      [plannedTasks]="plannedTasks()"
      [initialDate]="date()"
      (edit)="onCalendarEntryClick($event)"
      (dayClick)="onCalendarDayClick($event)"
    />
  </UiModal>
}

<EntryFormModal
  [isOpen]="formOpen()"
  [mode]="formMode()"
  [entry]="selectedEntry()"
  [defaultDate]="date()"
  [taskOptions]="taskOptions()"
  [activityTypeOptions]="activityTypeOptions()"
  [saving]="formSaving()"
  (save)="onSaveEntry($event)"
  (close)="formOpen.set(false)"
/>
