<UiFlex
  direction="row"
  alignItems="center"
  [gap]="3"
  className="flex-wrap"
>
  <CommonTabGroup
    [tabs]="viewTabs"
    [selectedId]="mode()"
    [fullWidth]="false"
    size="sm"
    ariaLabel="Vista de bitácora"
    (selectedChange)="modeChange.emit($event)"
  />

  <UiFlex direction="row" alignItems="center" [gap]="1" [noWrap]="true">
    <UiIconButton
      [Icon]="IconChevronLeftComponent"
      variant="tertiary"
      [compact]="true"
      labelText="Día anterior"
      (click)="onPrev()"
    />
    <UiDatePicker
      width="w-40! shrink-0"
      dateFormat="d/m/Y"
      placeholder="Elegir fecha"
      [value]="date()"
      [dayMark]="loggedDayMark()"
      (valueChange)="onPickDate($event)"
    />
    <UiIconButton
      [Icon]="IconChevronRightComponent"
      variant="tertiary"
      [compact]="true"
      labelText="Día siguiente"
      (click)="onNext()"
    />
    <UiLabel type="bodyS" color="textWeak" className="min-w-20">
      {{ dowLabel() }}
    </UiLabel>
  </UiFlex>

  <UiFlex direction="row" [gap]="0" className="flex-1" />
  <UiLabel type="bodyXs" color="textWeak">
    Hoy: {{ todayLabel() }}
  </UiLabel>
</UiFlex>
