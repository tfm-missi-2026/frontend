<div class="min-h-screen xl:flex">
  <div>
    <SidebarLayout></SidebarLayout>
    <app-backdrop></app-backdrop>
  </div>
  <div class="flex-1 transition-all duration-300 ease-in-out" [ngClass]="containerClasses()">
    <app-header />
    <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
      <router-outlet></router-outlet>
    </div>
  </div>
  <UiIconButton
    variant="secondary"
    [compact]="true"
    [Icon]="toggleIcon()"
    [iconProps]="{ width: 18, height: 18 }"
    [tooltip]="toggleTooltip()"
    tooltipSide="right"
    [style.left]="toggleLeft()"
    className="fixed top-20 z-50 rounded-full border border-gray-200 bg-white shadow-theme-sm dark:border-gray-700 dark:bg-gray-800 hidden xl:inline-flex transition-all duration-300 ease-in-out"
    (click)="handleToggle()"
  />
</div>
