<UiSurface [variant]="surfaceVariant()" [padding]="'sm'" [dataTestId]="'alert'">
  <UiFlex [alignItems]="'center'" [gap]="3">
    <UiIcon [variant]="iconVariant()" [dataTestId]="'alert-icon'">
      @switch (variant()) {
        @case ("success") {
          <IconSuccess [size]="20" />
        }
        @case ("error") {
          <IconError [size]="20" />
        }
        @case ("warning") {
          <IconWarning [size]="20" />
        }
        @case ("info") {
          <IconInfoCircle [size]="20" />
        }
      }
    </UiIcon>

    <UiFlex [direction]="'column'" [gap]="1">
      @if (title()) {
        <UiLabel
          [type]="'bodyXs'"
          [weight]="'semibold'"
          [color]="'textStrong'"
          [text]="title()"
        ></UiLabel>
      }

      <UiLabel
        [type]="'bodyS'"
        [color]="'textWeak'"
        [text]="message()"
      ></UiLabel>

      @if (showLink()) {
        <UiLink
          [to]="linkHref()"
          [variant]="'subtle'"
          [underline]="'always'"
          [size]="'md'"
        >
          {{ linkText() }}
        </UiLink>
      }
    </UiFlex>
  </UiFlex>
</UiSurface>
